<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revoada</title>
<script>
  // mesmo tema escolhido no app
  (() => { let t; try { t = localStorage.getItem("theme"); } catch {} document.documentElement.dataset.theme = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t === "light" ? "light" : "dark"; })();
</script>
<style>
  /* Painel da barra de menus no Grafite do app: a folha escura cobre o vidro da janela nativa, que só dá o contorno e a sombra. */
  @font-face { font-family: "Geist"; src: url("/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Newsreader"; src: url("/newsreader.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  :root {
    --fundo: rgba(17, 17, 18, .94); --sup: #19191b; --sup2: #232326;
    --fio: rgba(255, 255, 255, .075); --fio2: rgba(255, 255, 255, .14); --foco: rgba(255, 255, 255, .3);
    --tinta: #ededee; --tinta2: #a7a7ac; --tinta3: #6f6f75;
    --verde: #5fd08a; --ambar: #e5b454; --erro: #ef6f6c;
    --botao: #ededee; --sobre-botao: #111112;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --fundo: rgba(251, 251, 250, .95); --sup: #f1f1f0; --sup2: #e6e6e5;
    --fio: rgba(17, 17, 18, .09); --fio2: rgba(17, 17, 18, .18); --foco: rgba(17, 17, 18, .4);
    --tinta: #111112; --tinta2: #55555a; --tinta3: #8a8a90;
    --verde: #1f8a4c; --ambar: #8a5a06; --erro: #c23b38;
    --botao: #111112; --sobre-botao: #fbfbfa;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.45 "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--tinta); -webkit-user-select: none; user-select: none; cursor: default; -webkit-font-smoothing: antialiased; }
  body.preview { background: #050506; min-height: 100vh; padding: 30px; }
  body.preview #root { border-radius: 16px; box-shadow: 0 0 0 1px var(--fio2), 0 20px 60px rgba(0, 0, 0, .5); }
  #root { width: 372px; padding: 14px 14px 10px; background: var(--fundo); }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: default; }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; }

  header { display: flex; align-items: center; gap: 8px; padding: 0 4px 12px; }
  header .logo { width: 24px; line-height: 0; }
  .logo svg path { fill: currentColor; }
  header b { font-family: "Newsreader", "Iowan Old Style", Georgia, serif; font-size: 18px; font-weight: 400; letter-spacing: -.012em; line-height: 1; }
  header .sum { margin-left: auto; color: var(--tinta3); font-size: 12px; }
  .logo.fly svg path { transform-box: fill-box; transform-origin: center; animation: flap .9s ease-in-out infinite; }
  .logo.fly svg path:nth-child(2) { animation-delay: -.3s; } .logo.fly svg path:nth-child(3) { animation-delay: -.6s; }
  @keyframes flap { 50% { transform: translateY(-9%) scaleY(.72); } }

  h6 { margin: 14px 4px 6px; font: 500 12.5px "Geist", -apple-system, sans-serif; letter-spacing: .01em; color: var(--tinta3); }

  /* agora */
  .card { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; }
  .card:hover { background: var(--sup); }
  .card .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { color: var(--tinta2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .time { color: var(--tinta3); font-size: 11.5px; }
  .card.busy .time { color: var(--tinta2); }
  .eq { display: flex; gap: 2.5px; align-items: flex-end; height: 14px; justify-content: center; }
  .eq i { width: 3px; border-radius: 2px; background: var(--tinta); height: 30%; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.25s; } .eq i:nth-child(3) { animation-delay: -.5s; }
  @keyframes eq { 50% { height: 100%; } }
  .rest { width: 7px; height: 7px; border-radius: 50%; background: var(--tinta3); margin: 0 auto; }
  .rest.hit { background: var(--erro); }
  .rest.wait { background: var(--ambar); }
  .quiet { padding: 8px 4px 2px; color: var(--tinta2); }
  .quiet span { display: block; color: var(--tinta3); font-size: 12px; }

  /* contas */
  .prov { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; align-items: start; padding: 4px; }
  .prov > span { color: var(--tinta2); padding-top: 4px; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 9px 0 8px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--fio2); font-size: 12px; overflow: hidden; max-width: 100%; transition: background-color .12s ease; }
  .pill:hover { background: var(--sup); }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--tinta2); flex: none; }
  .pill.use i { background: var(--verde); box-shadow: 0 0 0 0 var(--verde); animation: ring 1.4s ease-out infinite; }
  @keyframes ring { to { box-shadow: 0 0 0 6px transparent; } }
  .pill.off { color: var(--tinta3); box-shadow: inset 0 0 0 1px var(--fio); }
  .pill.off i { background: none; box-shadow: inset 0 0 0 1px var(--tinta3); }
  .pill.lim { color: var(--erro); } .pill.lim i { background: var(--erro); }
  .pill em { font-style: normal; color: var(--tinta3); }
  .pill.lim em { color: inherit; opacity: .85; }
  .pill .bar { position: absolute; left: 0; bottom: 0; height: 1.5px; background: var(--tinta2); }
  .pill .bar.amber { background: var(--ambar); } .pill .bar.red, .pill.lim .bar { background: var(--erro); }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* pedido rápido */
  .ask { margin-top: 14px; background: var(--sup); border-radius: 12px; padding: 10px 10px 8px 12px; box-shadow: inset 0 0 0 1px var(--fio2); transition: box-shadow .12s ease; }
  .ask:focus-within { box-shadow: inset 0 0 0 1px var(--foco); }
  .ask .in { display: flex; gap: 8px; align-items: center; }
  .ask input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13.5px; -webkit-user-select: text; user-select: text; }
  .ask input::placeholder { color: var(--tinta3); }
  .ask .go { width: 26px; height: 26px; border-radius: 50%; background: var(--botao); color: var(--sobre-botao); display: grid; place-items: center; flex: none; transition: scale .12s ease, opacity .12s ease; }
  .ask .go:active { scale: .96; }
  .ask .go:disabled { opacity: .3; }
  .ask small { display: block; color: var(--tinta3); font-size: 11.5px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 4px 4px 0; border-top: 1px solid var(--fio); color: var(--tinta2); font-size: 12px; }
  footer button { min-height: 32px; transition: color .12s ease; }
  footer .acts { display: flex; gap: 14px; }
  footer button:hover { color: var(--tinta); }
  .sw { display: inline-flex; align-items: center; gap: 7px; }
  .sw b { width: 26px; height: 15px; border-radius: 999px; background: var(--sup2); box-shadow: inset 0 0 0 1px var(--fio2); position: relative; transition: background-color .15s ease; }
  .sw b::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--tinta2); transition: transform .15s ease, background-color .15s ease; }
  .sw.on b { background: var(--botao); box-shadow: none; } .sw.on b::after { transform: translateX(11px); background: var(--sobre-botao); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="root">
  <header><span class="logo" id="logo"></span><b>revoada</b><span class="sum" id="sum"></span></header>
  <div id="now"></div>
  <h6>Contas</h6>
  <div id="accounts"></div>
  <form class="ask" id="ask">
    <div class="in"><input id="q" placeholder="Peça qualquer coisa" autocomplete="off" spellcheck="false" aria-label="Pedido rápido">
      <button class="go" id="go" aria-label="Enviar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    <small id="askSub"></small>
  </form>
  <footer><button class="sw" id="rot"><b></b>Rodízio</button>
    <span class="acts"><button data-open="go({type:'brain'})" id="brain"></button><button data-open="">Abrir a Revoada</button></span></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const inApp = !!window.webkit?.messageHandlers?.revoada;
const native = (msg) => inApp && window.webkit.messageHandlers.revoada.postMessage(msg);
if (!inApp) document.body.classList.add("preview");
let S = null;

const dur = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}m`; };
const left = (ms) => { const m = Math.max(0, Math.ceil(ms / 60000)); return m < 60 ? `${m}min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`; };
const acc = (id) => S.accounts.find((a) => a.id === id);
const prov = (id) => S.providers.find((p) => p.id === id);
// a conta do login da máquina aparece pelo e-mail, não como "padrão desta máquina" (igual em todo provedor)
const rot = (a) => (a.id !== `${a.provider}-padrao` ? a.label : a.status?.detail?.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/)?.[0] || "desta máquina");
const accName = (a) => (a ? `${prov(a.provider).name} · ${rot(a)}` : "conta removida");
const base = (p) => p.split("/").filter(Boolean).pop() || "/";
const ready = (a) => a.status.ok && !a.limit;

function target() {
  const saved = JSON.parse(store("targets", "[]")).filter((t) => t.startsWith("pool:") ? S.accounts.some((a) => a.provider === t.slice(5) && ready(a)) : acc(t) && ready(acc(t)));
  if (saved.length) return saved[0];
  const p = S.providers.find((p) => S.accounts.some((a) => a.provider === p.id && ready(a)));
  return p ? "pool:" + p.id : null;
}
const cwd = () => store("cwd", S.projects);

function render() {
  if (!S) return;
  const live = S.sessions.filter((s) => s.alive), busy = live.filter((s) => s.busy), idle = live.filter((s) => !s.busy);
  const chats = (S.convos || []).filter((c) => c.working);
  const runs = S.runs.filter((r) => r.running), working = busy.length + runs.length + chats.length;
  const inUse = new Set([...busy.map((s) => s.accountId), ...chats.map((c) => c.accountId)]);
  $("logo").classList.toggle("fly", working > 0);
  $("sum").textContent = working ? `${working} trabalhando` : live.length ? `${live.length} ${live.length === 1 ? "aberta" : "abertas"}` : "tudo quieto";

  const card = (cls, icon, title, sub, at, open) => `<button class="card ${cls}" data-open="${esc(open)}">${icon}<div style="min-width:0"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div></div><span class="time num mono" data-since="${at}"></span></button>`;
  const eq = `<span class="eq"><i></i><i></i><i></i></span>`;
  let now = chats.map((c) => c.waiting ? card("", `<span class="rest wait"></span>`, c.title, `${accName(acc(c.accountId))} · esperando sua permissão`, c.startedAt, `go({type:'chat',id:'${c.id}'})`) : card("busy", eq, c.title, `${accName(acc(c.accountId))} · ${base(c.cwd)}`, c.startedAt, `go({type:'chat',id:'${c.id}'})`)).join("") + busy.map((s) => card("busy", eq, s.title, `${accName(acc(s.accountId))} · ${base(s.cwd)}`, s.startedAt, `go({type:'session',id:'${s.id}'})`)).join("")
    + runs.map((r) => card("busy", eq, r.title, `${r.jobs} contas em paralelo · ${base(r.cwd)}`, r.at, `go({type:'run',id:'${r.id}'})`)).join("")
    + idle.map((s) => card("", `<span class="rest ${s.limitHit ? "hit" : ""}"></span>`, s.title, `${accName(acc(s.accountId))} · ${s.limitHit ? "bateu no limite" : "parada, pode estar esperando você"}`, s.startedAt, `go({type:'session',id:'${s.id}'})`)).join("");
  if (!now) now = `<div class="quiet">Nenhum agente trabalhando.<span>O que você pedir aqui embaixo vira uma conversa.</span></div>`;
  if (render.now !== now) $("now").innerHTML = render.now = now;

  const accs = S.providers.filter((p) => p.installed).map((p) => `<div class="prov"><span>${p.name}</span><div class="pills">${S.accounts.filter((a) => a.provider === p.id).map((a) => {
    if (a.limit) return `<button class="pill lim" data-open="go({type:'accounts'})" aria-label="${esc(rot(a))}, ${esc(a.limit.reason)}"><i></i><span>${esc(rot(a))}</span><em class="num" data-left="${a.limit.until}"></em><b class="bar" data-from="${a.limit.at}" data-to="${a.limit.until}"></b></button>`;
    if (!a.status.ok) return `<button class="pill off" data-open="go({type:'accounts'})"><i></i><span>${esc(rot(a))} · sem login</span></button>`;
    const top = Math.max(0, ...(a.usage || []).map((u) => u.pct)), note = (a.usage || []).map((u) => `${{ five_hour: "5h", seven_day: "7 dias" }[u.key] || u.key}: ${u.pct}%`).join(" · ");
    return `<button class="pill ${inUse.has(a.id) ? "use" : "ok"}" data-open="go({type:'accounts'})" aria-label="${esc(rot(a))}, ${inUse.has(a.id) ? "em uso" : "pronta"}${note ? ", " + note : ""}"><i></i><span>${esc(rot(a))}</span>${a.usage?.length ? `<em class="num">${top}%</em><b class="bar ${top >= 95 ? "red" : top >= 75 ? "amber" : ""}" style="width:${top}%"></b>` : ""}</button>`;
  }).join("")}</div></div>`).join("");
  if (render.accs !== accs) $("accounts").innerHTML = render.accs = accs;

  const t = target();
  $("go").disabled = !t;
  $("askSub").textContent = t ? `${t.startsWith("pool:") ? prov(t.slice(5)).name : accName(acc(t))} · em ${cwd().replace(S.home, "~")}${store("brain", "1") === "1" ? " · com o cérebro" : ""}` : "Nenhuma conta pronta. Faça login em Contas.";
  $("rot").classList.toggle("on", S.settings.rotate);
  const blocked = Object.values(S.brain.blocked || {}).reduce((a, b) => a + b, 0);
  $("brain").textContent = `Cérebro · ${S.brain.notes}`;
  $("brain").setAttribute("aria-label", `Cérebro, ${S.brain.notes} notas, ${blocked} fora do contexto`);
  tick();
}

// cronômetros e contagens regressivas andam sozinhos entre uma leitura e outra
function tick() {
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach((el) => (el.textContent = dur(now - +el.dataset.since)));
  document.querySelectorAll("[data-left]").forEach((el) => (el.textContent = left(+el.dataset.left - now)));
  document.querySelectorAll(".bar[data-from]").forEach((el) => { const a = +el.dataset.from, b = +el.dataset.to; el.style.width = `${Math.max(0, Math.min(100, ((b - now) / (b - a)) * 100))}%`; });
}

async function refresh() {
  try { S = await (await fetch(location.search.includes("demo") ? "/api/demo-state" : "/api/state")).json(); render(); } catch {}
  if (S && !refresh.said) { refresh.said = true; native({ ready: `${$("sum").textContent}, ${S.accounts.length} contas, ${document.querySelectorAll(".pill").length} pastilhas` }); }
}
window.refresh = refresh;

document.addEventListener("click", (e) => { const b = e.target.closest("[data-open]"); if (b) native({ open: b.dataset.open }); });
$("rot").onclick = async () => { await fetch("/api/settings", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ rotate: !S.settings.rotate }) }); refresh(); };
$("ask").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = $("q").value.trim(), t = target(); if (!prompt || !t) return;
  $("go").disabled = true;
  const r = await (await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt, targets: [t], cwd: cwd(), brain: store("brain", "1") === "1" }) })).json();
  $("q").value = "";
  if (r.id) native({ open: `refresh().then(() => go({type:'${r.kind}',id:'${r.id}'}))` });
  refresh();
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") native({ close: true }); });
new ResizeObserver(() => native({ height: Math.ceil($("root").getBoundingClientRect().height) })).observe($("root"));

fetch("/logo.svg").then((r) => r.text()).then((svg) => { $("logo").innerHTML = svg; });
refresh();
setInterval(refresh, 1500);
setInterval(tick, 1000);
</script>
</body>
</html>
