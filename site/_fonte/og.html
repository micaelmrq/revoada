<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de link da Revoada</title>
<style>
  /* O cartão que aparece quando o link da página é compartilhado (og.jpg, 1200x630): a frase da capa e o print real
     da conversa (img/conversa.webp), no tema Grafite. O canto de baixo à esquerda fica livre, porque algumas redes
     põem o domínio por cima da imagem ali. Para refazer: abrir esta página em 1200x630 e salvar como ../og.jpg. */
  @font-face { font-family: "Geist"; src: url("../geist.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Newsreader"; src: url("../newsreader.woff2") format("woff2"); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #111112; }
  body { position: relative; font-family: "Geist", system-ui, sans-serif; color: #ededee; -webkit-font-smoothing: antialiased; }
  .marca { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 12px; font: 400 32px/1 "Newsreader", Georgia, serif; letter-spacing: -0.012em; }
  .marca svg { width: 42px; height: 28px; }
  h1 { position: absolute; left: 64px; top: 168px; width: 470px; font: 400 68px/1.04 "Newsreader", Georgia, serif; letter-spacing: -0.024em; }
  p { position: absolute; left: 64px; top: 404px; width: 420px; font-size: 23px; line-height: 1.4; color: #a7a7ac; }
  .janela { position: absolute; left: 590px; top: 64px; width: 900px; overflow: hidden; border-radius: 12px; background: #0c0c0d; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 18px 50px rgba(0, 0, 0, 0.5); }
  .barra { display: flex; align-items: center; gap: 7px; height: 30px; padding-left: 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.075); }
  .barra i { width: 9px; height: 9px; border-radius: 50%; background: #232326; }
  img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="marca"><svg viewBox="150 250 720 480" aria-hidden="true" fill="#ededee"><path d="M240.6 383.8Q288 292.3 351.3 362.4Q404.2 284.1 464 368.2Q405.1 328.2 354.3 405.5Q293.3 336 240.6 383.8Z" fill-opacity=".45"/><path d="M496.7 466.5Q555.6 316.5 665.4 415.2Q734.8 284.9 841.4 405.8Q743.3 353.3 677.1 481.7Q571 383.6 496.7 466.5Z"/><path d="M164.6 690.3Q280.1 456.9 449.5 626.1Q580 425.4 741.5 629.6Q585.8 535.4 460.8 733.5Q297.3 565.7 164.6 690.3Z"/></svg>revoada</div>
  <h1>Seus agentes de código, numa sala só.</h1>
  <p>Claude Code, Codex, Gemini CLI e Grok num app de Mac, com as contas que você já paga.</p>
  <div class="janela"><div class="barra"><i></i><i></i><i></i></div><img src="../img/conversa.webp" alt=""></div>
</body>
</html>
